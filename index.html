<script>
const practice=[{"type":"mc","category":"Verb patterns · -ing","prompt":"Leah avoids ___ her homework at the last minute.","options":["to do","doing","do"],"answer":1,"explanation":"Avoid is followed by an -ing form: avoid doing something.","hint":"Think about the pattern after avoid."},{"type":"mc","category":"Verb patterns · to-infinitive","prompt":"We’re hoping ___ the exhibition before it closes.","options":["visit","to visit","visiting"],"answer":1,"explanation":"Hope + to-infinitive: hope to visit.","hint":"Hope is followed by to + verb."},{"type":"mc","category":"Bare infinitive · let","prompt":"The coach let the team ___ their break early.","options":["to take","taking","take"],"answer":2,"explanation":"Let + object + bare infinitive: let the team take.","hint":"After let someone, do we need to?"},{"type":"mc","category":"Prepositions · -ing","prompt":"Are you interested in ___ a coding club?","options":["joining","join","to join"],"answer":0,"explanation":"After a preposition such as in, use -ing: interested in joining.","hint":"Here in is a preposition."},{"type":"mc","category":"Verb patterns · to-infinitive","prompt":"Dylan offered ___ us to the station.","options":["driving","drive","to drive"],"answer":2,"explanation":"Offer + to-infinitive: offered to drive.","hint":"Offer expresses a willingness to do something."},{"type":"mc","category":"Bare infinitive · make","prompt":"Mum made us ___ the dishes after lunch.","options":["wash","to wash","washing"],"answer":0,"explanation":"Make + person + bare infinitive: made us wash.","hint":"Compare: We were made to wash (passive)."},{"type":"mc","category":"Verb patterns · -ing","prompt":"Would you consider ___ a second-hand bike?","options":["to buy","buy","buying"],"answer":2,"explanation":"Consider + -ing: consider buying.","hint":"Consider is followed by an -ing form."},{"type":"mc","category":"Bare infinitive · would rather","prompt":"I’d rather ___ at home tonight.","options":["stay","to stay","staying"],"answer":0,"explanation":"Would rather + bare infinitive: I’d rather stay.","hint":"No to follows would rather."},{"type":"mc","category":"Verb patterns · to-infinitive","prompt":"The organisers refused ___ the date again.","options":["changing","to change","change"],"answer":1,"explanation":"Refuse + to-infinitive: refused to change.","hint":"Refuse + to + verb."},{"type":"mc","category":"Meaning · stop","prompt":"During her hike, Nina stopped to tie her boot. What happened?","options":["She gave up hiking for good.","She paused the hike in order to tie her boot.","She finished tying her boot and carried on."],"answer":1,"explanation":"Stop to do something means pause another activity for a purpose.","hint":"Ask: What was the purpose of stopping?"},{"type":"mc","category":"Meaning · remember","prompt":"I clearly remember locking the front gate. What does this mean?","options":["I have a memory of locking it.","I still need to lock it.","I asked someone else to lock it."],"answer":0,"explanation":"Remember doing refers to a memory of an earlier event.","hint":"Did the locking already happen?"},{"type":"mc","category":"Meaning · try","prompt":"The signal was weak, so we tried moving the router upstairs. Why?","options":["To test a possible solution.","Because we had been forbidden to move it.","Because moving it was impossible."],"answer":0,"explanation":"Try doing means experiment with an action to see whether it helps.","hint":"A test of one possible solution."},{"type":"mc","category":"Meaning · try to","prompt":"I tried to catch the last bus, but it had already left. What happened?","options":["I successfully caught the bus.","I made an effort but missed the bus.","I tested the idea of taking a bus as a solution."],"answer":1,"explanation":"Try to do something stresses an attempt or effort to achieve a goal.","hint":"Focus on the effort and the result."},{"type":"text","category":"Open gap · -ing","prompt":"The council suggested ___ (create) a community garden.","answers":["creating"],"explanation":"Suggest + -ing: suggested creating.","hint":"Suggest + -ing."},{"type":"text","category":"Open gap · to-infinitive","prompt":"We plan ___ (launch) a podcast about history.","answers":["to launch"],"explanation":"Plan + to-infinitive: plan to launch.","hint":"Plan + to + verb."},{"type":"text","category":"Open gap · -ing","prompt":"The journalist enjoyed ___ (interview) local artists.","answers":["interviewing"],"explanation":"Enjoy + -ing: enjoyed interviewing.","hint":"Enjoy + -ing."},{"type":"text","category":"Transformation · let","prompt":"The librarian said we could borrow two books. (LET)\nThe librarian ___ two books.","answers":["let us borrow"],"explanation":"Let + object + bare infinitive: let us borrow.","hint":"Include the object pronoun us."},{"type":"text","category":"Transformation · manage","prompt":"The speech was difficult, but she succeeded in finishing it. (MANAGED)\nShe ___ the speech.","answers":["managed to finish"],"explanation":"Manage + to-infinitive shows success despite difficulty.","hint":"Manage to + verb."},{"type":"text","category":"Translation · remember","prompt":"Remember ___ the lights before leaving. (wyłączyć)","answers":["to turn off","to switch off"],"explanation":"Remember to turn/switch off refers to a future action you must not forget.","hint":"Do not write the full sentence; supply the missing words."},{"type":"text","category":"Error correction · let","prompt":"Correct the whole sentence:\nThe teacher let me to use the projector.","answers":["the teacher let me use the projector"],"explanation":"Let + person + bare infinitive, without to.","hint":"Remove the unnecessary word after me."},{"type":"mc","category":"Functions · polite request","prompt":"Would you mind ___ the timetable on your phone?","options":["checking","to check","check"],"answer":0,"explanation":"Would you mind + -ing is a polite request.","hint":"After mind, use -ing."},{"type":"mc","category":"Reading · details","prompt":"Why did the pupils move their cameras nearer to the window?","options":["To test whether the light would be better.","Because the window was broken.","Because Noah told them to put the cameras away."],"answer":0,"explanation":"They tried changing position because their photos were too dark.","hint":"Find what happened just before they moved.","passage":"THE PHOTOGRAPHY WORKSHOP\nOn Friday, Noah offered to run a photography workshop for younger pupils. He began by explaining how to use natural light. Some photos came out too dark, so the group tried moving their cameras closer to the window. That helped. Before leaving, Noah reminded everyone to save their photos in a shared folder."},{"type":"mc","category":"Reading · details","prompt":"What did Noah remind the pupils to do?","options":["Print every photograph.","Save their work in a shared folder.","Buy better cameras."],"answer":1,"explanation":"He reminded the group to save their photographs.","hint":"Look at the final sentence.","passage":"THE PHOTOGRAPHY WORKSHOP\nOn Friday, Noah offered to run a photography workshop for younger pupils. He began by explaining how to use natural light. Some photos came out too dark, so the group tried moving their cameras closer to the window. That helped. Before leaving, Noah reminded everyone to save their photos in a shared folder."},{"type":"mc","category":"Reading · details","prompt":"What problem happened on the first morning of the book swap?","options":["Lena forgot the posters.","Nobody was interested in books.","The school was closed."],"answer":0,"explanation":"Lena forgot to bring the posters, so people struggled to find the event.","hint":"The answer is in the second sentence.","passage":"THE BOOK SWAP\nWhen Lena joined the school book swap, she didn’t expect to enjoy organising it. On the first morning, she forgot to bring the posters, so visitors struggled to find the event. Lena decided to prepare a checklist for next time. By Friday, she had met several students who loved the same authors as she did."},{"type":"mc","category":"Reading · inference","prompt":"What will Lena probably do before the next book swap?","options":["Ask students not to bring books.","Stop organising events.","Use a checklist to remember important things."],"answer":2,"explanation":"After forgetting the posters, she decided to prepare a checklist.","hint":"Look for her future plan.","passage":"THE BOOK SWAP\nWhen Lena joined the school book swap, she didn’t expect to enjoy organising it. On the first morning, she forgot to bring the posters, so visitors struggled to find the event. Lena decided to prepare a checklist for next time. By Friday, she had met several students who loved the same authors as she did."}];
const exam=[{"type":"mc","category":"Verb patterns · -ing","prompt":"They postponed ___ the match because of the storm.","options":["to play","playing","play"],"answer":1,"explanation":"Postpone + -ing: postponed playing."},{"type":"mc","category":"Passive · to-infinitive","prompt":"The pupils were allowed ___ their designs at home.","options":["complete","completing","to complete"],"answer":2,"explanation":"Be allowed + to-infinitive: were allowed to complete."},{"type":"mc","category":"Verb patterns · to-infinitive","prompt":"The speaker persuaded us ___ in the campaign.","options":["to take part","taking part","take part"],"answer":0,"explanation":"Persuade someone to do something."},{"type":"mc","category":"Verb patterns · to-infinitive","prompt":"Dad reminded me ___ the windows before we left.","options":["closing","close","to close"],"answer":2,"explanation":"Remind someone to do something: a reminder before an action."},{"type":"mc","category":"Prepositions · -ing","prompt":"She’s keen on ___ to use the telescope.","options":["learn","to learn","learning"],"answer":2,"explanation":"On is a preposition here; keen on learning."},{"type":"mc","category":"Verb patterns · negative infinitive","prompt":"The class agreed not ___ during the demonstration.","options":["to talk","talking","talk"],"answer":0,"explanation":"Negative infinitive: agree not to talk."},{"type":"mc","category":"Adjective · to-infinitive","prompt":"This device is easy ___.","options":["using","to use","use"],"answer":1,"explanation":"Adjective + to-infinitive: easy to use."},{"type":"mc","category":"Passive · make","prompt":"The students were made ___ outside until the hall was ready.","options":["waiting","wait","to wait"],"answer":2,"explanation":"Passive make takes to: were made to wait."},{"type":"mc","category":"Meaning · stop","prompt":"We stopped to take photos at the viewpoint. What does this tell us?","options":["We gave up photography permanently.","We paused our journey in order to take pictures.","We stopped taking pictures."],"answer":1,"explanation":"Stop to do something expresses the purpose of stopping."},{"type":"mc","category":"Meaning · remember","prompt":"I remember seeing that painting on my first visit. What does the speaker mean?","options":["The speaker recalls a past experience.","The speaker must remember to look at it later.","The speaker forgot where the museum is."],"answer":0,"explanation":"Remember doing = a memory of a completed experience."},{"type":"mc","category":"Meaning · try","prompt":"To improve her concentration, Rina tried studying with headphones. What did she do?","options":["She failed to buy headphones.","She was forced to listen to music.","She tested studying with headphones as an idea."],"answer":2,"explanation":"Try doing is to test a possible approach."},{"type":"text","category":"Open gap · -ing","prompt":"Nadia admitted ___ (forget) the appointment.","answers":["forgetting"],"explanation":"Admit + -ing: admitted forgetting."},{"type":"text","category":"Open gap · to-infinitive","prompt":"He offered ___ (carry) the boxes upstairs.","answers":["to carry"],"explanation":"Offer + to-infinitive: offered to carry."},{"type":"text","category":"Transformation · fail","prompt":"The tourists didn’t succeed in reaching the island before dark. (FAILED)\nThe tourists ___ the island before dark.","answers":["failed to reach"],"explanation":"Fail + to-infinitive: failed to reach."},{"type":"text","category":"Transformation · make","prompt":"The instructor forced us to repeat the difficult section. (MADE)\nThe instructor ___ the difficult section.","answers":["made us repeat"],"explanation":"Active make + object + bare infinitive: made us repeat."},{"type":"text","category":"Translation · preposition","prompt":"We’re interested in ___ Japanese. (nauce)","answers":["learning","studying"],"explanation":"Interested in + -ing. Both learning and studying are natural translations here."},{"type":"mc","category":"Reading · detail","prompt":"Why did the volunteers move their rehearsal indoors?","options":["There was a problem with the costumes.","It began to rain.","The performance had been cancelled."],"answer":1,"explanation":"They had planned to rehearse outside but it started raining.","passage":"THE COMMUNITY PLAY\nAt a community theatre, young volunteers were preparing a short play. They had planned to rehearse outdoors, but it started raining. Their director suggested using the library meeting room instead. One volunteer forgot to bring a costume, but the group managed to make a replacement from spare fabric. The performance began on time. Afterwards, the director thanked everyone for staying calm."},{"type":"mc","category":"Reading · inference","prompt":"How did the group deal with the missing costume?","options":["They made a replacement from spare fabric.","They postponed the performance until next month.","They sent the volunteer home."],"answer":0,"explanation":"They managed to create a replacement and the performance started on time.","passage":"THE COMMUNITY PLAY\nAt a community theatre, young volunteers were preparing a short play. They had planned to rehearse outdoors, but it started raining. Their director suggested using the library meeting room instead. One volunteer forgot to bring a costume, but the group managed to make a replacement from spare fabric. The performance began on time. Afterwards, the director thanked everyone for staying calm."}];
let mode='practice', index=0,checked=false, hintCount=0, responsesPractice=[], responsesExam=[], flags={};
const $=id=>document.getElementById(id);
const expand={"isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","hasn't":"has not","haven't":"have not","won't":"will not","don't":"do not","doesn't":"does not","didn't":"did not"};
function clean(x){let t=String(x??'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").trim();for(const [con,full] of Object.entries(expand))t=t.replaceAll(con,full);return t.replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim()}
function isAnswered(x){return x!==null && x!==undefined && String(x).trim()!==''}
function isRight(q,x){if(!isAnswered(x))return false;if(q.type==='mc')return typeof x==='number' && x===q.answer;return q.answers.some(a=>clean(a)===clean(x))}
function correctText(q){return q.type==='mc'?('ABC'[q.answer]+'. '+q.options[q.answer]):q.answers[0]}
function bank(){return mode==='practice'?practice:exam}
function curr(){let q=bank()[index];if(q.type==='mc'){let a=document.querySelector('input[name="choice"]:checked');return a?Number(a.value):null}let t=$('typed');return t?t.value.trim():null}
function help(text,kind=''){let f=$('feedbackBox');f.className='feedback '+kind;f.replaceChildren();let d=document.createElement('div');d.textContent=text;f.append(d)}
function reset(nextMode=mode){mode=nextMode;index=0;checked=false;hintCount=0;responsesPractice=new Array(practice.length).fill(null);responsesExam=new Array(exam.length).fill(null);flags={};$('practiceTab').classList.toggle('active',mode==='practice');$('examTab').classList.toggle('active',mode==='exam');$('practiceTab').setAttribute('aria-pressed',mode==='practice');$('examTab').setAttribute('aria-pressed',mode==='exam');$('modeHelp').textContent=mode==='practice'?'Practice Mode — 25 questions. Ask for a hint and get immediate feedback with a short explanation. The questions do not repeat the Miro worksheet.':'Exam Mode — 18 different questions. No hints or feedback until you finish. Move between questions, skip if needed and review your answers at the end.';$('taskPanel').classList.remove('hidden');$('resultPanel').classList.add('hidden');render()}
function render(){const qs=bank(),q=qs[index];checked=false;$('progressBar').style.width=(100*(mode==='practice'?index:responsesExam.filter(isAnswered).length)/qs.length)+'%';$('counter').textContent=(index+1)+' / '+qs.length;$('chip').textContent=q.category;$('kind').textContent=q.type==='mc'?'Choose A, B or C':'Complete the gap / rewrite the sentence';$('question').textContent=q.prompt;$('reading').classList.toggle('hidden',!q.passage);$('reading').textContent=q.passage||'';$('answer').replaceChildren();$('feedbackBox').className='feedback hidden';$('feedbackBox').textContent='';$('hintBox').className='feedback hidden';$('hintBox').textContent='';
if(q.type==='mc'){let group=document.createElement('div');group.className='options';q.options.forEach((s,i)=>{let lbl=document.createElement('label');lbl.className='option';let inp=document.createElement('input');inp.type='radio';inp.name='choice';inp.value=String(i);inp.checked=mode==='exam'&&responsesExam[index]===i;let letter=document.createElement('span');letter.className='letter';letter.textContent='ABC'[i]+'.';let txt=document.createElement('span');txt.textContent=s;lbl.append(inp,letter,txt);group.append(lbl)});$('answer').append(group)}else{let input=document.createElement('input');input.id='typed';input.className='text-answer';input.autocomplete='off';input.spellcheck=false;input.placeholder=q.prompt.startsWith('Correct the whole sentence:')?'Type the complete corrected sentence':'Type only the missing words';input.setAttribute('aria-label','Type your answer');if(mode==='exam'&&typeof responsesExam[index]==='string')input.value=responsesExam[index];input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(mode==='practice')checkPractice();else nextExam()}});$('answer').append(input);let note=document.createElement('div');note.className='tip';note.textContent='Contractions and common spelling variants are accepted when appropriate.';$('answer').append(note)}
$('hintButton').classList.toggle('hidden',mode!=='practice');$('backButton').classList.toggle('hidden',mode!=='exam'||index===0);$('skipButton').classList.toggle('hidden',mode!=='exam');$('checkButton').classList.remove('hidden');$('checkButton').textContent=mode==='practice'?'Check answer':(index===exam.length-1?'Finish exam':'Save & next');$('nextButton').classList.add('hidden');$('jump').classList.toggle('hidden',mode!=='exam');if(mode==='exam')makeJump()}
function makeJump(){$('jump').replaceChildren();exam.forEach((q,j)=>{let b=document.createElement('button');b.type='button';b.className='number'+(j===index?' active':'')+(isAnswered(responsesExam[j])?' answered':'');b.textContent=j+1;b.title='Go to question '+(j+1);b.setAttribute('aria-label','Exam question '+(j+1));b.onclick=()=>{saveCurrent();index=j;render()};$('jump').append(b)})}
function checkPractice(){if(checked)return;let q=practice[index],a=curr();if(!isAnswered(a)){help('Choose an answer or type the missing words first.');return}checked=true;responsesPractice[index]=a;const good=isRight(q,a);let box=$('feedbackBox');box.className='feedback '+(good?'good':'bad');box.replaceChildren();let label=document.createElement('strong');label.textContent=good?'✓ Correct!':'Not quite — correct answer:';box.append(label);if(!good){let k=document.createElement('div');k.textContent=correctText(q);box.append(k)}let reason=document.createElement('div');reason.textContent=q.explanation;box.append(reason);$('checkButton').classList.add('hidden');$('hintButton').classList.add('hidden');$('nextButton').classList.remove('hidden');$('nextButton').textContent=index===practice.length-1?'See my result':'Next →';document.querySelectorAll('input[name="choice"]').forEach(el=>el.disabled=true);if($('typed'))$('typed').disabled=true}
function saveCurrent(){let a=curr();responsesExam[index]=isAnswered(a)?a:null}
function nextExam(skip=false){if(skip)responsesExam[index]=null;else saveCurrent();if(index===exam.length-1){showResult()}else{index++;render()}}
function goBack(){saveCurrent();if(index>0){index--;render()}}
function nextPractice(){if(index===practice.length-1)showResult();else{index++;render()}}
function resultsText(){let q=bank(),r=mode==='practice'?responsesPractice:responsesExam;return 'Unit 37 -ing and Infinitive | '+mode.toUpperCase()+' | '+q.filter((v,i)=>isRight(v,r[i])).length+'/'+q.length+'\n'+q.map((v,i)=>(i+1)+'. '+(isRight(v,r[i])?'✓':'✗')+' '+v.prompt.replace(/\n/g,' / ')+' | Your answer: '+(r[i]===null?'(blank)':v.type==='mc'?v.options[r[i]]:r[i])+' | Correct: '+correctText(v)).join('\n')}
function showResult(){$('taskPanel').classList.add('hidden');let panel=$('resultPanel');panel.classList.remove('hidden');panel.replaceChildren();let qs=bank(),resp=mode==='practice'?responsesPractice:responsesExam,score=qs.reduce((s,q,i)=>s+Number(isRight(q,resp[i])),0),percent=Math.round(score/qs.length*100);let h=document.createElement('h2');h.className='result-title';h.textContent=mode==='practice'?'Practice complete!':'Exam results';let mark=document.createElement('div');mark.className='score';mark.textContent=score+' / '+qs.length;let sub=document.createElement('div');sub.className='summary';sub.textContent=percent+'% correct · '+(mode==='practice'?'Hints used: '+hintCount+'.':'All answers were checked at the end.');panel.append(h,mark,sub);
let list=document.createElement('div');list.className='details';qs.forEach((q,i)=>{let a=resp[i],ok=isRight(q,a);let card=document.createElement('article');card.className='review '+(ok?'ok':'bad');let heading=document.createElement('h3');heading.textContent=(i+1)+'. '+q.prompt;card.append(heading);let yours=document.createElement('p');yours.className=ok?'right':'wrong';yours.textContent='Your answer: '+(!isAnswered(a)?'(blank)':q.type==='mc'?q.options[a]:a);card.append(yours);let correct=document.createElement('p');correct.className='right';correct.textContent='Correct: '+correctText(q);card.append(correct);let explain=document.createElement('p');explain.className='muted';explain.textContent='Why: '+q.explanation;card.append(explain);if(mode==='exam'&&q.type==='text'&&!ok&&isAnswered(a)){let wrapper=document.createElement('div');wrapper.className='review-controls';let b=document.createElement('button');b.textContent='Flag a possible alternative for teacher review';b.onclick=()=>{flags[i]=!flags[i];b.textContent=flags[i]?'✓ Flagged · Undo':'Flag a possible alternative for teacher review';$('flagNote').textContent=Object.values(flags).filter(Boolean).length+' answer(s) flagged. The automatic score stays unchanged.'};wrapper.append(b);card.append(wrapper)}list.append(card)});
if(mode==='practice'){let details=document.createElement('details');details.className='details';let summary=document.createElement('summary');summary.textContent='Review all questions and explanations';summary.style.fontWeight='750';summary.style.cursor='pointer';details.append(summary,list);panel.append(details)}else{let note=document.createElement('p');note.className='summary';note.id='flagNote';note.textContent='If a natural alternative is not recognised, flag it for your teacher. Automatic score stays unchanged.';panel.append(note,list)}
let controls=document.createElement('div');controls.className='results-tools';let redo=document.createElement('button');redo.className='btn main';redo.textContent='Restart '+(mode==='practice'?'Practice':'Exam');redo.onclick=()=>reset(mode);let switchMode=document.createElement('button');switchMode.className='btn';switchMode.textContent=mode==='practice'?'Try Exam Mode':'Go to Practice';switchMode.onclick=()=>reset(mode==='practice'?'exam':'practice');let copy=document.createElement('button');copy.className='btn';copy.textContent='Copy results';copy.onclick=async()=>{let text=resultsText();try{await navigator.clipboard.writeText(text);copy.textContent='✓ Results copied'}catch(e){let el=document.createElement('textarea');el.value=text;document.body.append(el);el.select();try{document.execCommand('copy');copy.textContent='✓ Results copied'}catch(error){copy.textContent='Copy unavailable'}el.remove()}};controls.append(redo,switchMode,copy);panel.append(controls);window.scrollTo({top:0,behavior:'smooth'})}
$('practiceTab').onclick=()=>reset('practice');$('examTab').onclick=()=>reset('exam');$('restartTop').onclick=()=>reset(mode);$('hintButton').onclick=()=>{if(mode==='practice'&&!checked&&$('hintBox').classList.contains('hidden')){hintCount++;$('hintBox').textContent='Hint: '+practice[index].hint;$('hintBox').classList.remove('hidden')}};$('checkButton').onclick=()=>mode==='practice'?checkPractice():nextExam();$('nextButton').onclick=nextPractice;$('skipButton').onclick=()=>nextExam(true);$('backButton').onclick=goBack;
reset('practice');
</script></body></html>
